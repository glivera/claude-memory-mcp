services:
  memory-mcp:
    build:
      context: .
      target: production
      tags:
        - "memory-mcp:latest"
    image: memory-mcp:latest
    ports:
      - "3101:3101"
    # Whitelist pass-through, injected by bin/up via doppler run. Names
    # must match src/config.ts; adding a variable is a deliberate edit
    # here, never a widening of what gets passed through.
    # RECALL_HYBRID and RECALL_ENVELOPE are intentionally absent: their
    # code defaults ('0' and '1' as of v0.4.0) are safe.
    environment:
      - MCP_PORT=3101
      - SUPABASE_URL
      - SUPABASE_SERVICE_KEY
      - OPENAI_API_KEY
      - EMBEDDING_MODEL
      - SIMILARITY_THRESHOLD
      - RECALL_TOKEN_CAP
      - DEFAULT_RECALL_LIMIT
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  dev:
    build:
      context: .
      target: base
    volumes:
      - .:/app
      - memory_mcp_node_modules:/app/node_modules
    ports:
      - "3101:3101"
    # Whitelist pass-through, injected by bin/up via doppler run. Names
    # must match src/config.ts; adding a variable is a deliberate edit
    # here, never a widening of what gets passed through.
    # RECALL_HYBRID and RECALL_ENVELOPE are intentionally absent: their
    # code defaults ('0' and '1' as of v0.4.0) are safe.
    environment:
      - MCP_PORT=3101
      - SUPABASE_URL
      - SUPABASE_SERVICE_KEY
      - OPENAI_API_KEY
      - EMBEDDING_MODEL
      - SIMILARITY_THRESHOLD
      - RECALL_TOKEN_CAP
      - DEFAULT_RECALL_LIMIT
    entrypoint: ["npx", "tsx", "src/index.ts"]

  test:
    build:
      context: .
      target: base
    volumes:
      - .:/app
      - memory_mcp_node_modules:/app/node_modules
    # .env is legacy (no longer generated); unit tests mock all secrets
    env_file:
      - path: .env
        required: false
    entrypoint: ["npx", "vitest"]

volumes:
  memory_mcp_node_modules:
